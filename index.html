<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mohamed Refky Portfolio</title>
    <meta name="description" content="Mohamed Refky - Flutter Developer Portfolio" />

    <!-- Google Fonts: Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
      body {
        background-color: #0F172A;
        margin: 0;
        padding: 0;
      }
      #splash {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: #0F172A;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        transition: opacity 0.5s ease-out;
      }
      .profile-container {
        position: relative;
        width: 200px;
        height: 200px;
        margin-bottom: 32px;
      }
      .profile-img {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        object-fit: cover;
        border: 4px solid #6366F1;
        box-shadow: 0 0 30px rgba(99, 102, 241, 0.5);
        animation: pulse 1.5s ease-in-out infinite;
      }
      .glow {
        position: absolute;
        top: -15px;
        left: -15px;
        right: -15px;
        bottom: -15px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(99, 102, 241, 0.4) 0%, transparent 70%);
        z-index: -1;
        animation: glow-pulse 1.5s ease-in-out infinite;
      }
      .name-text {
        color: #F8FAFC;
        font-family: 'Poppins', sans-serif;
        font-size: 1.8rem;
        font-weight: 700;
        letter-spacing: 2px;
      }
      .loading-bar {
        width: 200px;
        height: 3px;
        background: rgba(255, 255, 255, 0.1);
        margin-top: 24px;
        border-radius: 10px;
        overflow: hidden;
      }
      .loading-fill {
        width: 40%;
        height: 100%;
        background: linear-gradient(90deg, #6366F1, #22D3EE);
        animation: loading 0.8s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.03); }
      }
      @keyframes glow-pulse {
        0%, 100% { opacity: 0.6; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.1); }
      }
      @keyframes loading {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(300%); }
      }
    </style>
  </head>
  <body>
    <div id="splash">
      <div class="profile-container">
        <div class="glow"></div>
        <img id="splash-img" src="" class="profile-img" style="display:none;" alt="Mohamed Refky">
      </div>
      <div class="name-text">MOHAMED REFKY</div>
      <div class="loading-bar">
        <div class="loading-fill"></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
